<style>
:root{--blue:#1649a6;--blue2:#2563eb;--navy:#0c1e3d;--bg:#f4f7fb;--ink:#17233a;--muted:#6c7890;--line:#e5eaf2;--white:#fff;--green:#13865c;--orange:#f59e0b;--shadow:0 12px 35px rgba(24,54,103,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:248px;background:linear-gradient(180deg,#102b5d,#0c1e3d);color:#fff;padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 26px}.brand img{width:42px;height:42px;object-fit:contain;border-radius:12px;background:white}.brand b{font-size:18px;letter-spacing:1px}.brand small{display:block;color:#b8c8e5;font-size:11px;margin-top:3px}.navlabel{color:#91a9d1;font-size:10px;letter-spacing:1.5px;padding:12px 12px 8px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;background:transparent;color:#d9e4f7;border-radius:10px;text-align:left;margin:3px 0;font-size:14px}.nav button.active,.nav button:hover{background:#234984;color:white}#nav button[data-page="participants"]{display:none}.nav .ico{width:22px;text-align:center;font-size:17px}.sidebottom{margin-top:auto;padding:12px;color:#adc1e2;font-size:12px}.main{flex:1;min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.topbar .welcome{font-size:13px;color:var(--muted)}.topbar .welcome b{color:var(--ink);font-size:15px;display:block;margin-bottom:3px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;background:#e2ebff;color:var(--blue);border-radius:50%;display:grid;place-items:center;font-weight:700}.profile small{display:block;color:var(--muted);font-size:11px}.content{max-width:1200px;margin:auto;padding:30px 34px 50px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:24px}.pagehead h1{font-size:26px;margin:0 0 7px;letter-spacing:-.5px}.pagehead p{margin:0;color:var(--muted);font-size:14px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--blue2);color:white}.primary:hover{background:var(--blue)}.soft{background:#eaf1ff;color:var(--blue)}.danger{background:#fee2e2;color:#b42318}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow)}.stat .staticon{width:40px;height:40px;border-radius:12px;background:#edf3ff;display:grid;place-items:center;font-size:20px;margin-bottom:15px}.stat .num{font-size:27px;font-weight:750}.stat .label{font-size:12px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.panelhead{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panelhead h3{margin:0;font-size:15px}.panelbody{padding:18px 21px}.program{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #edf0f5}.program:last-child{border-bottom:0}.datebox{background:#edf3ff;color:var(--blue);border-radius:10px;min-width:54px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:750}.datebox small{font-size:10px;font-weight:700}.program h4{margin:1px 0 7px;font-size:14px}.program p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.pill{font-size:10px;font-weight:700;padding:5px 8px;border-radius:99px;background:#e8f8f0;color:#087443;display:inline-block}.notice{padding:12px 0;border-bottom:1px solid #edf0f5}.notice:last-child{border-bottom:0}.notice h4{font-size:13px;margin:0 0 6px}.notice p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 6px}.notice small{font-size:10px;color:#8290a6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.eventcard{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}.eventbanner{height:112px;background:linear-gradient(135deg,#1649a6,#5a8ff0);padding:18px;color:white;display:flex;align-items:flex-end;font-weight:750;font-size:18px}.eventcontent{padding:18px}.eventcontent h3{font-size:16px;margin:0 0 8px}.eventcontent p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 14px}.eventmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#53617a;margin-bottom:15px}.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.search{background:white;border:1px solid var(--line);padding:10px 13px;border-radius:10px;min-width:220px}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:14px 18px;text-align:left;border-bottom:1px solid #edf0f5;white-space:nowrap}.table th{color:var(--muted);font-size:11px;background:#fafbfd}.table td{color:#33415b}.adminnotice{background:#fff7e6;border:1px solid #ffe4a8;border-radius:12px;padding:14px 16px;color:#835b0b;font-size:12px;line-height:1.6;margin-bottom:20px}.empty{text-align:center;color:var(--muted);padding:30px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#07152a99;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:16px;width:min(480px,100%);padding:24px;box-shadow:0 30px 80px #0003}.modal h2{margin:0 0 18px;font-size:20px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #dce3ef;border-radius:9px;padding:11px;outline:none}.field textarea{min-height:90px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;bottom:24px;right:24px;background:#12294f;color:white;padding:13px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:20;font-size:13px}.mobilemenu{display:none}.profilewrap{position:relative;display:flex;align-items:center}.profilemenu{position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:8px;min-width:190px;z-index:9}.profilemenu button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:11px;border-radius:8px;color:var(--ink)}.profilemenu button:hover{background:#edf3ff}.profilemenu .menuuser{padding:10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
@media(max-width:1000px){.sidebar{width:215px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{width:70px;padding:18px 8px}.brand{justify-content:center;padding:0 0 22px}.brand img{width:42px}.brand b,.brand small,.navlabel,.nav button span:not(.ico),.sidebottom{display:none}.nav button{justify-content:center;padding:13px 5px}.topbar{padding:0 16px}.content{padding:22px 15px}.pagehead h1{font-size:22px}.stats{gap:10px}.stat{padding:14px}.stat .num{font-size:23px}.cards{grid-template-columns:1fr}.profile>div:last-child{display:none}.pagehead{align-items:center}}
</style>

<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><img src="assets/teamz-logo.jpeg" alt="TEAM Z logo"><div><b>TEAM Z</b><small>Together for Humanity</small></div></div>
<div class="navlabel">MENU</div><nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">⌂</span><span>ড্যাশবোর্ড</span></button>
<button data-page="programs"><span class="ico">▦</span><span>প্রোগ্রাম</span></button>
<button data-page="notices"><span class="ico">▤</span><span>নোটিশ</span></button>
<button data-page="participants"><span class="ico">♙</span><span>অংশগ্রহণকারী</span></button>
<button data-page="admin"><span class="ico">⚙</span><span>Admin Panel</span></button>
</nav><div class="sidebottom">TEAM Z • একসাথে মানবতার পাশে</div>
</aside>
<main class="main"><header class="topbar"><div class="welcome"><b id="topTitle">ড্যাশবোর্ড</b>TEAM Z-এর সাথে থাকুন, মানুষের পাশে দাঁড়ান</div><div class="profilewrap"><button class="profile" id="profileToggle" style="border:0;background:transparent;text-align:left"><div class="avatar" id="avatar">Z</div><div><b id="userName">Guest User</b><small id="userRole">সদস্য</small></div><span>▾</span></button><div class="profilemenu hidden" id="profileMenu"><button onclick="showLogin()" id="menuLogin">🔐 Login</button></div></div></header>
<div class="content" id="content"></div></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const seedPrograms=[{id:1,title:'শীতবস্ত্র বিতরণ কর্মসূচি',date:'2026-11-15',place:'রাজশাহী',desc:'শীতার্ত মানুষের মাঝে শীতবস্ত্র বিতরণ। আপনার অংশগ্রহণ আমাদের উদ্যোগকে আরও শক্তিশালী করবে।',joined:false},{id:2,title:'পরিচ্ছন্নতা অভিযান',date:'2026-11-22',place:'পদ্মা নদীর পাড়',desc:'পরিবেশ পরিচ্ছন্ন রাখতে স্বেচ্ছাসেবীদের নিয়ে পরিচ্ছন্নতা অভিযান।',joined:false},{id:3,title:'রক্তদান ও সচেতনতা',date:'2026-12-05',place:'রাজশাহী',desc:'রক্তদানের গুরুত্ব সম্পর্কে সচেতনতা এবং স্বেচ্ছায় রক্তদাতাদের তালিকা।',joined:false}];
const seedNotices=[{id:1,title:'TEAM Z-এ স্বাগতম',body:'আমাদের কমিউনিটির লক্ষ্য সামাজিক ও মানবিক কাজের মাধ্যমে মানুষের পাশে দাঁড়ানো।',date:'2026-10-28'},{id:2,title:'স্বেচ্ছাসেবী সদস্য নিবন্ধন চলছে',body:'আসন্ন কর্মসূচিতে অংশ নিতে প্রোগ্রাম পেজ থেকে আপনার আগ্রহ জানিয়ে দিন।',date:'2026-10-27'}];
let state={user:JSON.parse(localStorage.getItem('tz_user')||'null'),profile:JSON.parse(localStorage.getItem('tz_profile')||'{}'),programs:JSON.parse(localStorage.getItem('tz_programs')||'null')||seedPrograms,notices:JSON.parse(localStorage.getItem('tz_notices')||'null')||seedNotices,participants:JSON.parse(localStorage.getItem('tz_participants')||'null')||[]};
let page='dashboard';const $=s=>document.querySelector(s);const fmt=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'})}catch{return d}};
function save(){localStorage.setItem('tz_programs',JSON.stringify(state.programs));localStorage.setItem('tz_notices',JSON.stringify(state.notices));localStorage.setItem('tz_participants',JSON.stringify(state.participants))}
function logAccess(user){if(!user||user.admin)return;let logs=JSON.parse(localStorage.getItem('tz_access_logs')||'[]');let now=new Date().toISOString();let row=logs.find(x=>x.email===user.email);if(row){row.name=user.name;row.lastAccess=now;row.visits=(row.visits||1)+1}else logs.unshift({name:user.name,email:user.email,lastAccess:now,visits:1});localStorage.setItem('tz_access_logs',JSON.stringify(logs))}
function accessTime(v){try{return new Date(v).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'})}catch{return v||'—'}}
function toast(t){$('#toastRoot').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function setPage(p){if(p==='participants'&&!state.user?.admin){p='dashboard'}page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent=({dashboard:'ড্যাশবোর্ড',programs:'প্রোগ্রাম',notices:'নোটিশ',participants:'অংশগ্রহণকারী',admin:'Admin Panel'})[p];render()}
function programHTML(x){return `<div class="program"><div class="datebox"><small>${new Date(x.date+'T00:00:00').toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</small>${new Date(x.date+'T00:00:00').getDate()}</div><div style="flex:1"><h4>${esc(x.title)}</h4><p>📍 ${esc(x.place)} &nbsp; • &nbsp; ${fmt(x.date)}</p><p style="margin-top:5px">${esc(x.desc)}</p></div><span class="pill">${x.joined?'আগ্রহী':'আসন্ন'}</span></div>`}
function noticeHTML(n){return `<div class="notice"><h4>${esc(n.title)}</h4><p>${esc(n.body)}</p><small>${fmt(n.date)}</small></div>`}
function render(){let c=$('#content');if(page==='dashboard'){c.innerHTML=`<div class="pagehead"><div><h1>স্বাগতম, ${esc(state.user?.name||'TEAM Z সদস্য')} 👋</h1><p>আমাদের পরবর্তী উদ্যোগে আপনার অংশগ্রহণই সবচেয়ে বড় শক্তি।</p></div><button class="btn primary" onclick="setPage('programs')">প্রোগ্রাম দেখুন ↗</button></div><div class="stats"><div class="stat"><div class="staticon">♙</div><div class="num">${state.participants.length+24}</div><div class="label">কমিউনিটি সদস্য</div></div><div class="stat"><div class="staticon">▦</div><div class="num">${state.programs.length}</div><div class="label">সক্রিয় প্রোগ্রাম</div></div><div class="stat"><div class="staticon">♡</div><div class="num">${state.participants.length}</div><div class="label">আগ্রহ প্রকাশ</div></div><div class="stat"><div class="staticon">▤</div><div class="num">${state.notices.length}</div><div class="label">প্রকাশিত নোটিশ</div></div></div><div class="grid2"><section class="panel"><div class="panelhead"><h3>আসন্ন প্রোগ্রাম</h3><button class="btn soft" onclick="setPage('programs')">সব দেখুন</button></div><div class="panelbody">${state.programs.slice(0,3).map(programHTML).join('')||'<div class="empty">এখন কোনো প্রোগ্রাম নেই</div>'}</div></section><section class="panel"><div class="panelhead"><h3>সর্বশেষ নোটিশ</h3><button class="btn soft" onclick="setPage('notices')">সব দেখুন</button></div><div class="panelbody">${state.notices.slice(0,4).map(noticeHTML).join('')||'<div class="empty">নোটিশ নেই</div>'}</div></section></div>`}
else if(page==='programs'){c.innerHTML=`<div class="pagehead"><div><h1>প্রোগ্রাম ও ইভেন্ট</h1><p>TEAM Z-এর মানবিক উদ্যোগে অংশ নিতে আপনার আগ্রহ জানান।</p></div></div><div class="cards">${state.programs.map(x=>`<article class="eventcard"><div class="eventbanner">${esc(x.title)}</div><div class="eventcontent"><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><div class="eventmeta"><span>📅 ${fmt(x.date)}</span><span>📍 ${esc(x.place)}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${getMyResponse(x.id)==='yes'?'soft':'primary'}" onclick="respondProgram(${x.id},'yes')">${getMyResponse(x.id)==='yes'?'✓ অংশ নিতে চাই':'আমি অংশ নিতে চাই'}</button><button class="btn ${getMyResponse(x.id)==='no'?'soft':'soft'}" onclick="respondProgram(${x.id},'no')">${getMyResponse(x.id)==='no'?'✓ অংশ নেব না':'আমি অংশ নেব না'}</button></div><p style="font-size:11px;color:var(--muted);margin-top:10px">পরে মত বদলালে অন্য অপশনটি বেছে নিতে পারবেন।</p></div></article>`).join('')}</div>`}
else if(page==='notices'){c.innerHTML=`<div class="pagehead"><div><h1>নোটিশ বোর্ড</h1><p>TEAM Z-এর গুরুত্বপূর্ণ ঘোষণা ও আপডেট।</p></div></div><section class="panel"><div class="panelbody">${state.notices.map(noticeHTML).join('')||'<div class="empty">কোনো নোটিশ নেই</div>'}</div></section>`}
else if(page==='participants'){c.innerHTML=`<div class="pagehead"><div><h1>অংশগ্রহণকারী</h1><p>প্রোগ্রামে আগ্রহ প্রকাশ করা সদস্যদের তালিকা।</p></div></div><div class="adminnotice">ডেমোতে অংশগ্রহণকারীদের তথ্য এই ব্রাউজারের local storage-এ সংরক্ষিত হয়।</div><section class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>নাম</th><th>ইমেইল</th><th>প্রোগ্রাম</th><th>সিদ্ধান্ত</th><th>তারিখ</th></tr></thead><tbody>${state.participants.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.program)}</td><td>${x.response==='no'?'অংশ নেবে না':'অংশ নিতে চায়'}</td><td>${fmt(x.date)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">এখনো কেউ আগ্রহ জানায়নি</td></tr>'}</tbody></table></div></section>`}
else if(page==='admin'){if(!state.user?.admin){c.innerHTML=`<div class="pagehead"><div><h1>Admin Panel</h1><p>প্রোগ্রাম ও নোটিশ পরিচালনা করুন।</p></div></div><div class="adminnotice"><b>Admin access প্রয়োজন।</b><br>ডেমো অ্যাডমিন হিসেবে প্রবেশ করতে Login চাপুন এবং email: <b>admin@teamz.demo</b>, password: <b>teamz123</b> ব্যবহার করুন।</div><button class="btn primary" onclick="showLogin(true)">Admin Login</button>`;return}c.innerHTML=`<div class="pagehead"><div><h1>Admin Panel</h1><p>আপনার কমিউনিটির কনটেন্ট পরিচালনা করুন।</p></div><span class="pill">Admin Access</span></div><div class="adminnotice"><b>ডেমো মোড:</b> এই Admin Panel-এর তথ্য এই ব্রাউজারেই সংরক্ষিত হয়। বাস্তব অ্যাপে secure backend, authentication ও database সংযোগ করতে হবে।</div><div class="stats"><div class="stat"><div class="staticon">▦</div><div class="num">${state.programs.length}</div><div class="label">প্রোগ্রাম</div></div><div class="stat"><div class="staticon">▤</div><div class="num">${state.notices.length}</div><div class="label">নোটিশ</div></div><div class="stat"><div class="staticon">♙</div><div class="num">${state.participants.length}</div><div class="label">আগ্রহী সদস্য</div></div><div class="stat"><div class="staticon">⚙</div><div class="num">Admin</div><div class="label">আপনার ভূমিকা</div></div></div><div class="grid2"><section class="panel"><div class="panelhead"><h3>প্রোগ্রাম ম্যানেজ করুন</h3><button class="btn primary" onclick="showProgramForm()">＋ নতুন প্রোগ্রাম</button></div><div class="panelbody">${state.programs.map(x=>`<div class="program"><div style="flex:1"><h4>${esc(x.title)}</h4><p>${fmt(x.date)} • ${esc(x.place)}</p></div><button class="btn danger" onclick="deleteProgram(${x.id})">মুছুন</button></div>`).join('')}</div></section><section class="panel"><div class="panelhead"><h3>নোটিশ ম্যানেজ করুন</h3><button class="btn primary" onclick="showNoticeForm()">＋ নতুন নোটিশ</button></div><div class="panelbody">${state.notices.map(x=>`<div class="notice"><h4>${esc(x.title)}</h4><p>${esc(x.body)}</p><button class="btn danger" onclick="deleteNotice(${x.id})">মুছুন</button></div>`).join('')}</div></section></div><section class="panel" style="margin-top:20px"><div class="panelhead"><h3>সদস্যদের অ্যাক্সেস / Login History</h3><span class="pill">শুধু Admin</span></div><div class="tablewrap"><table class="table"><thead><tr><th>সদস্যের নাম</th><th>ইমেইল</th><th>শেষ অ্যাক্সেস</th><th>মোট ভিজিট</th></tr></thead><tbody>${(JSON.parse(localStorage.getItem('tz_access_logs')||'[]')).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${accessTime(u.lastAccess)}</td><td>${u.visits||1}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">এখনো কোনো সদস্য Login করেনি</td></tr>'}</tbody></table></div></section><section class="panel" style="margin-top:20px"><div class="panelhead"><h3>প্রোগ্রামে আগ্রহী সদস্য</h3></div><div class="tablewrap"><table class="table"><thead><tr><th>নাম</th><th>ইমেইল</th><th>প্রোগ্রাম</th><th>সিদ্ধান্ত</th><th>তারিখ</th></tr></thead><tbody>${state.participants.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.program)}</td><td>${x.response==='no'?'অংশ নেবে না':'অংশ নিতে চায়'}</td><td>${fmt(x.date)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">এখনো কেউ আগ্রহ জানায়নি</td></tr>'}</tbody></table></div></section>`}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getMyResponse(id){if(!state.user)return '';let p=state.programs.find(x=>x.id===id);if(!p)return '';let r=state.participants.find(x=>x.email===state.user.email&&x.program===p.title);return r?.response||''}
function respondProgram(id,response){if(!state.user){showLogin();return}let p=state.programs.find(x=>x.id===id);if(!p)return;let date=new Date().toISOString().slice(0,10);let existing=state.participants.find(x=>x.email===state.user.email&&x.program===p.title);if(existing){existing.response=response;existing.date=date;existing.name=state.user.name}else{state.participants.push({name:state.user.name,email:state.user.email,program:p.title,date,response})}p.joined=response==='yes';save();render();toast(response==='yes'?'আপনার অংশগ্রহণের আগ্রহ সংরক্ষণ হয়েছে':'আপনি অংশ নেবেন না—এই সিদ্ধান্ত সংরক্ষণ হয়েছে')}
function showModal(html){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
let authMode='login';
function showLogin(admin=false){authMode=admin?'admin':'login';renderAuthForm(admin)}
function renderAuthForm(admin=false){
 const reg=authMode==='register';
 showModal(`<h2>${admin?'Admin Login':reg?'নতুন সদস্য নিবন্ধন':'সদস্য Login'}</h2><p style="color:var(--muted);font-size:12px">${admin?'ডেমো অ্যাডমিন অ্যাকাউন্ট দিয়ে প্রবেশ করুন।':reg?'নাম, ইমেইল ও পাসওয়ার্ড দিয়ে নতুন অ্যাকাউন্ট খুলুন।':'আগে নিবন্ধন করা ইমেইল ও পাসওয়ার্ড দিয়ে প্রবেশ করুন।'}</p>${reg?`<div class="field"><label>পূর্ণ নাম</label><input id="authName" placeholder="আপনার পূর্ণ নাম"></div>`:''}<div class="field"><label>ইমেইল</label><input id="authEmail" type="email" placeholder="name@example.com" value="${admin?'admin@teamz.demo':''}"></div><div class="field"><label>পাসওয়ার্ড</label><input id="authPass" type="password" placeholder="কমপক্ষে ৬ অক্ষর" value="${admin?'teamz123':''}"></div><div class="modalactions" style="justify-content:space-between"><button class="btn soft" onclick="closeModal()">বাতিল</button><div style="display:flex;gap:8px;flex-wrap:wrap">${!admin?`<button class="btn soft" onclick="authMode='${reg?'login':'register'}';renderAuthForm()">${reg?'Login করুন':'নিবন্ধন করুন'}</button>`:''}<button class="btn primary" onclick="${admin?'login()':reg?'registerUser()':'login()'}">${admin?'Admin Login':reg?'অ্যাকাউন্ট তৈরি করুন':'Login'}</button></div></div>`)
}
function registerUser(){
 let name=$('#authName').value.trim(),email=$('#authEmail').value.trim().toLowerCase(),pass=$('#authPass').value;
 if(!name||!email||!pass){toast('নাম, ইমেইল ও পাসওয়ার্ড পূরণ করুন');return}
 if(pass.length<6){toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে');return}
 if(email==='admin@teamz.demo'){toast('এই ইমেইলটি Admin-এর জন্য সংরক্ষিত');return}
 let users=JSON.parse(localStorage.getItem('tz_accounts')||'[]');
 if(users.some(u=>u.email===email)){toast('এই ইমেইলে আগে অ্যাকাউন্ট খোলা হয়েছে। Login করুন।');return}
 users.push({name,email,pass});localStorage.setItem('tz_accounts',JSON.stringify(users));
 state.user={name,email,admin:false};state.profile={name,phone:'',blood:'',address:'',about:'',photo:''};
 localStorage.setItem('tz_user',JSON.stringify(state.user));localStorage.setItem('tz_profile',JSON.stringify(state.profile));logAccess(state.user);
 updateUserUI();closeModal();render();toast('নিবন্ধন সফল! আপনি Login করেছেন।');
}
function login(){
 let name=$('#authName')?.value.trim()||'',email=$('#authEmail').value.trim().toLowerCase(),pass=$('#authPass').value;
 if(!email||!pass){toast('ইমেইল ও পাসওয়ার্ড দিন');return}
 let admin=email==='admin@teamz.demo'&&pass==='teamz123';
 if(email==='admin@teamz.demo'&&!admin){toast('Admin password সঠিক নয়');return}
 if(!admin){let users=JSON.parse(localStorage.getItem('tz_accounts')||'[]'),user=users.find(u=>u.email===email&&u.pass===pass);if(!user){toast('অ্যাকাউন্ট পাওয়া যায়নি বা পাসওয়ার্ড ভুল। আগে Registration করুন।');return}name=user.name}
 state.user={name:name||email.split('@')[0],email,admin};
 if(!admin){let users=JSON.parse(localStorage.getItem('tz_accounts')||'[]'),user=users.find(u=>u.email===email);state.profile=JSON.parse(localStorage.getItem('tz_profile')||'{}');if(!state.profile.name)state.profile={name:user.name,phone:'',blood:'',address:'',about:'',photo:''};}
 localStorage.setItem('tz_user',JSON.stringify(state.user));logAccess(state.user);updateUserUI();closeModal();render();toast(admin?'Admin হিসেবে প্রবেশ করেছেন':'Login সফল');
}
function updateUserUI(){
 $('#userName').textContent=state.user?.name||'Guest User';$('#userRole').textContent=state.user?.admin?'Admin':'সদস্য';
 $('#avatar').textContent=(state.user?.name||'Z').slice(0,1).toUpperCase();$('#profileMenu').classList.add('hidden');
 
 $('#menuUser').textContent=state.user?state.user.name+' • '+state.user.email:'Guest User';
}
function logout(){state.user=null;localStorage.removeItem('tz_user');$('#profileMenu').classList.add('hidden');$('#userName').textContent='Guest User';$('#userRole').textContent='সদস্য';$('#avatar').textContent='Z';$('#menuUser').textContent='Guest User';setPage('dashboard');toast('Logout সম্পন্ন')}
function showProgramForm(){showModal(`<h2>নতুন প্রোগ্রাম</h2><div class="field"><label>প্রোগ্রামের নাম</label><input id="pTitle" placeholder="যেমন: বৃক্ষরোপণ কর্মসূচি"></div><div class="field"><label>তারিখ</label><input id="pDate" type="date"></div><div class="field"><label>স্থান</label><input id="pPlace" placeholder="প্রোগ্রামের স্থান"></div><div class="field"><label>বিবরণ</label><textarea id="pDesc" placeholder="প্রোগ্রাম সম্পর্কে লিখুন"></textarea></div><div class="modalactions"><button class="btn soft" onclick="closeModal()">বাতিল</button><button class="btn primary" onclick="addProgram()">প্রকাশ করুন</button></div>`)}
function addProgram(){let title=$('#pTitle').value.trim(),date=$('#pDate').value,place=$('#pPlace').value.trim(),desc=$('#pDesc').value.trim();if(!title||!date||!place){toast('নাম, তারিখ ও স্থান পূরণ করুন');return}state.programs.unshift({id:Date.now(),title,date,place,desc,joined:false});save();closeModal();render();toast('নতুন প্রোগ্রাম প্রকাশিত হয়েছে')}
function showNoticeForm(){showModal(`<h2>নতুন নোটিশ</h2><div class="field"><label>শিরোনাম</label><input id="nTitle" placeholder="নোটিশের শিরোনাম"></div><div class="field"><label>বিস্তারিত</label><textarea id="nBody" placeholder="নোটিশের বিবরণ"></textarea></div><div class="modalactions"><button class="btn soft" onclick="closeModal()">বাতিল</button><button class="btn primary" onclick="addNotice()">প্রকাশ করুন</button></div>`)}
function addNotice(){let title=$('#nTitle').value.trim(),body=$('#nBody').value.trim();if(!title||!body){toast('শিরোনাম ও বিবরণ লিখুন');return}state.notices.unshift({id:Date.now(),title,body,date:new Date().toISOString().slice(0,10)});save();closeModal();render();toast('নোটিশ প্রকাশিত হয়েছে')}
function deleteProgram(id){if(!confirm('এই প্রোগ্রামটি মুছে ফেলবেন?'))return;state.programs=state.programs.filter(x=>x.id!==id);save();render();toast('প্রোগ্রাম মুছে ফেলা হয়েছে')}
function deleteNotice(id){if(!confirm('এই নোটিশটি মুছে ফেলবেন?'))return;state.notices=state.notices.filter(x=>x.id!==id);save();render();toast('নোটিশ মুছে ফেলা হয়েছে')}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('#profileToggle').onclick=()=>{if(state.user){openProfile()}else{showLogin()}};document.addEventListener('click',e=>{if(!e.target.closest('.profilewrap'))$('#profileMenu').classList.add('hidden')});if(state.user){$('#userName').textContent=state.user.name;$('#userRole').textContent=state.user.admin?'Admin':'সদস্য';$('#avatar').innerHTML=state.profile.photo?`<img src="${state.profile.photo}" alt="Profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`:state.user.name.slice(0,1).toUpperCase();}render();

function openProfile(){ $('#profileMenu').classList.add('hidden'); if(!state.user){showLogin();return} let pr=state.profile;showModal(`<h2>আমার প্রোফাইল</h2><div class="field"><label>প্রোফাইল ছবি</label><input type="file" id="profPhoto" accept="image/*" onchange="profilePhoto(event)"></div><div class="field"><label>পূর্ণ নাম</label><input id="profName" value="${esc(pr.name||state.user.name)}"></div><div class="field"><label>ইমেইল</label><input value="${esc(state.user.email)}" disabled></div><div class="field"><label>মোবাইল নম্বর</label><input id="profPhone" value="${esc(pr.phone||'')}" placeholder="01XXXXXXXXX"></div><div class="field"><label>রক্তের গ্রুপ</label><select id="profBlood"><option value="">নির্বাচন করুন</option>${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(x=>`<option ${pr.blood===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>ঠিকানা</label><input id="profAddress" value="${esc(pr.address||'')}"></div><div class="field"><label>নিজের সম্পর্কে</label><textarea id="profAbout">${esc(pr.about||'')}</textarea></div><div class="modalactions"><button class="btn soft" onclick="closeModal()">বাতিল</button><button class="btn primary" onclick="saveProfile()">সংরক্ষণ</button></div>`)}
function profilePhoto(e){let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.profile.photo=r.result;toast('ছবি নির্বাচিত হয়েছে; সংরক্ষণ চাপুন')};r.readAsDataURL(f)}
function saveProfile(){let name=$('#profName').value.trim();if(!name){toast('পূর্ণ নাম লিখুন');return}state.profile={...state.profile,name,phone:$('#profPhone').value.trim(),blood:$('#profBlood').value,address:$('#profAddress').value.trim(),about:$('#profAbout').value.trim()};state.user.name=name;localStorage.setItem('tz_profile',JSON.stringify(state.profile));localStorage.setItem('tz_user',JSON.stringify(state.user));$('#userName').textContent=name;$('#avatar').innerHTML=state.profile.photo?`<img src="${state.profile.photo}" alt="Profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`:name.slice(0,1).toUpperCase();$('#menuUser').textContent=name+' • '+state.user.email;closeModal();toast('প্রোফাইল সংরক্ষণ হয়েছে')}
</script>
